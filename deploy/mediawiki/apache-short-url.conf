<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteRule ^$ /index.php?title=HASI_Wissen [B,QSA,L]
    RewriteRule ^wiki/?$ /index.php?title=HASI_Wissen [B,QSA,L]
    RewriteRule ^wiki/(.*)$ /index.php?title=$1 [B,QSA,L]
</Directory>

<Directory /var/www/html/maintenance>
    Require all denied
</Directory>
