services:
  hasi:
    image: ${HASI_IMAGE:-hasi:demo-selfhost}
    pull_policy: never
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "3000"
    extra_hosts:
      - "hasi.metaneutrons.cc:host-gateway"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      HASI_DEMO_MODE: "1"
      NEXT_PUBLIC_HASI_PUBLIC_DEMO: "1"
      HASI_DEMO_ORIGIN: "https://hasi.metaneutrons.cc"
      HASI_DEMO_STATE_NAMESPACE: "production:v1"
      DATABASE_URL: ${DATABASE_URL:?Set the existing production Neon DATABASE_URL}
      HASI_DEMO_SECRET: ${HASI_DEMO_SECRET:?Set the provisioned server-only HASI_DEMO_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GWDG_API_KEY: ${GWDG_API_KEY:-}
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.hasi.rule=Host(`hasi.metaneutrons.cc`)
      - traefik.http.routers.hasi.entrypoints=https
      - traefik.http.routers.hasi.tls=true
      - traefik.http.routers.hasi.tls.certresolver=hasi-dns
      - traefik.http.services.hasi.loadbalancer.server.port=3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

networks:
  coolify:
    name: coolify
    external: true
