version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Keep TypeScript below the current typescript-eslint peer ceiling.
      # Recheck the parser's published peer range before removing this entry.
      - dependency-name: typescript
        versions: ['>=6.1']
      # Keep the Node typings on the runtime major (engines >=24, .nvmrc 24).
      # Raise this together with the minimum supported Node version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
