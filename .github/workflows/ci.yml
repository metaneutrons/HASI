name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hasi
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d hasi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/hasi
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace package declarations are emitted into dist and are needed by
      # strict type-aware linting as well as type checks and tests.
      - run: pnpm build
      - run: pnpm lint
      - name: Validate Git hooks
        run: pnpm exec lefthook validate
      - name: Probe release metadata and publication gates
        run: node --test scripts/release/*.test.mjs
      - run: pnpm typecheck
      # This explicit network step verifies and materializes the pinned public
      # anny schema used by client contract tests. Tests themselves do not fetch.
      - run: pnpm research:anny
      # A frozen workspace install does not populate metadata required by the
      # separate deploy lockfile. Prepare with policies enabled in a fresh cache;
      # the qualification test then packages strictly offline using that cache.
      - name: Prepare reference SDK deployment metadata
        run: pnpm reference:prepare
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/hasi-reference-cache
      - run: pnpm test:coverage
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/hasi-reference-cache

  security:
    name: Secrets and dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The action derives its scan range from a previous commit and fails on
      # the root commit. A verified CLI scans every reachable ref instead.
      - name: Install verified Gitleaks binary
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts='--all' .
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate

  commit-hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check title, body, and commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          cc='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Revert ".+")'
          ban='^[[:space:]]*co-authored-by:.*(claude|anthropic)|^[[:space:]]*generated with.*claude code'

          if ! printf '%s' "$PR_TITLE" | grep -Eq "$cc"; then
            echo "::error::pull request title does not follow Conventional Commits: $PR_TITLE"
            status=1
          fi

          if printf '%s' "$PR_BODY" | grep -Eiq "$ban"; then
            echo "::error::the pull request body contains an AI attribution trailer."
            status=1
          fi

          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format=%B "$sha" | grep -Eiq "$ban"; then
              echo "::error::commit $sha contains an AI attribution trailer."
              status=1
            fi
            email=$(git log -1 --format='%ae%n%ce' "$sha")
            if printf '%s' "$email" | grep -Fq 'noreply@anthropic.com'; then
              echo "::error::commit $sha has an Anthropic address as author or committer."
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            exit 1
          fi

  ci-success:
    name: CI Success
    if: always()
    needs: [quality, security, commit-hygiene]
    runs-on: ubuntu-24.04
    steps:
      - name: Every preceding job must have succeeded or been skipped
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJSON(needs) }}' |
            jq -e 'all(.[]; .result == "success" or .result == "skipped")'
